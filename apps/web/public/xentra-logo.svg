<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="xentraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <!-- Símbolo Geométrico XENTRA: Rombo central de transparencia comunitaria y pilares hexagonales -->
  <polygon points="50,10 90,32 90,68 50,90 10,68 10,32" stroke="url(#xentraGrad)" stroke-width="6" stroke-linejoin="round" fill="#0F172A" />
  <!-- Núcleo de balance financiero: 'X' entrelazada con prisma transparente -->
  <path d="M30,35 L70,65 M70,35 L30,65" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" />
  <circle cx="50" cy="50" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" />
</svg>
